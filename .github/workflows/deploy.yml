name: Deploy to Production VPS (tandamen.kz)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to tandamen.kz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Backend BootJar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon -x test

      - name: Build Frontend SPA
        working-directory: frontend
        env:
          VITE_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: 470329734598-c32dk937vu2hgkbvblqjuvi43noc1mu9.apps.googleusercontent.com
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS Server
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '194.238.40.236' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        if: env.VPS_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          echo "==> Deploying Backend to VPS..."
          scp backend/build/libs/tanda-backend-1.0.0.jar "${VPS_USER}@${VPS_HOST}:/opt/tanda/tanda-backend.jar"

          echo "==> Deploying Frontend to VPS..."
          tar -czf /tmp/frontend-dist.tar.gz -C frontend/dist .
          scp /tmp/frontend-dist.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/frontend-dist.tar.gz"
          ssh "${VPS_USER}@${VPS_HOST}" "rm -rf /var/www/tanda/* && tar -xzf /tmp/frontend-dist.tar.gz -C /var/www/tanda && chown -R ubuntu:ubuntu /var/www/tanda && rm /tmp/frontend-dist.tar.gz"

          echo "==> Restarting services..."
          ssh "${VPS_USER}@${VPS_HOST}" "systemctl restart tanda-backend && systemctl reload nginx"

          echo "==> Deploy completed successfully to https://tandamen.kz!"
