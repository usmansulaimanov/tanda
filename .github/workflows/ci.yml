name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: c2VjdXJlLXRlc3Qtand0LXNlY3JldC1rZXktZm9yLXRhbmRhLXByb2R1Y3Rpb24tZ3JhZGUtdmVyaWZpY2F0aW9u
        run: ./gradlew test --no-daemon

      - name: Build BootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload Backend BootJar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanda-backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7

      - name: Trigger Render Deploy Hook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment for live server..."
          curl -f -sS -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Note: RENDER_DEPLOY_HOOK_URL not configured or curl finished with code $?"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Typecheck & Build
        working-directory: frontend
        run: npm run build
