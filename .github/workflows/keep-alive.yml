name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes 24/7 to prevent Render free instance spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Tanda Render backend to keep instance warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 25 https://tanda-backend-7lpj.onrender.com/api/v1/books || true)
          echo "Response HTTP status: $HTTP_STATUS"
