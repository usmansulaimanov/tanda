spring:
  application:
    name: tanda-backend-test
  datasource:
    url: jdbc:h2:mem:tanda_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cookie:
    secure: false
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}
  rate-limiting:
    enabled: false
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

jwt:
  secret: ${JWT_SECRET:test-super-secret-jwt-key-minimum-256-bits-for-security-2026}
  expiration: 900000
