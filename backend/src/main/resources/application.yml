server:
  port: ${PORT:8080}

spring:
  application:
    name: tanda-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: smtp.gmail.com
    port: 465
    protocol: smtps
    username: ${MAIL_USERNAME:tandamenapp@gmail.com}
    password: ${MAIL_PASSWORD:cssvrfxvyndipamn}
    properties:
      mail:
        transport:
          protocol: smtps
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.gmail.com
            protocols: TLSv1.2 TLSv1.3
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:#{null}}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://tanda-xi.vercel.app}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

google:
  client-id: ${GOOGLE_CLIENT_ID:470329734598-c32dk937vu2hgkbvblqjuvi43noc1mu9.apps.googleusercontent.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: Tanda Backend
      version: 1.0.0
