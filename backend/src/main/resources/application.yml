server:
  port: ${PORT:8080}

spring:
  application:
    name: tanda-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:#{null}}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

google:
  client-id: ${GOOGLE_CLIENT_ID:249161344734-j51fft6shbogf2clnrhofn3l0c1euihl.apps.googleusercontent.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: Tanda Backend
      version: 1.0.0
